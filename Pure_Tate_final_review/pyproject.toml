[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pure-tate-research"
version = "0.1.0"
description = "A source-audited research and proof harness for H^16 of stable-curve moduli."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
corpus = ["pypdf>=5"]

[project.scripts]
pure-tate = "pure_tate.cli:main"

[tool.setuptools]
packages = ["pure_tate"]
